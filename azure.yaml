name: fit-journal
metadata:
  template: fit-journal-azd@1.0.0

services:
  api:
    project: ./FitJournal.Api
    language: dotnet
    host: appservice
  web:
    project: ../fit-journal-frontend
    language: js
    host: appservice

hooks:
  postprovision:
    posix:
      shell: sh
      run: ./scripts/grant-sql-access.sh
    windows:
      shell: pwsh
      run: ./scripts/grant-sql-access.ps1
